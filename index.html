<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Zombie Shooter</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            background-color: #000;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        
        /* LEFT SIDE UI ELEMENTS */
        #minimap-container {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 140px;
            height: 140px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            overflow: hidden;
            background-color: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
            z-index: 10;
        }
        #minimap {
            width: 100%;
            height: 100%;
        }

        #stats-panel {
            position: absolute;
            top: 170px;
            left: 15px;
            background: rgba(0, 0, 0, 0.65);
            padding: 10px 15px;
            border-radius: 8px;
            border-left: 4px solid #ff4444;
            color: white;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stat-value {
            color: #ffeb3b;
        }

        /* DYNAMIC AIM CROSSHAIR (Placed ahead at zombie height) */
        #crosshair {
            position: absolute;
            width: 24px;
            height: 24px;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 5;
            display: none; /* Screen-projected aim is drawn via camera ray */
        }
        
        /* Visual Aim Indicator (UI) */
        #aim-reticle {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 50, 50, 0.8);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 8;
            box-shadow: 0 0 4px #ff0000;
        }
        #aim-reticle::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: #ff0000;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* RIGHT SIDE CONTROLS */
        .control-btn {
            position: absolute;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            color: white;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
            z-index: 10;
        }
        .control-btn:active {
            background: rgba(255, 255, 255, 0.5);
        }

        #fire-btn {
            bottom: 30px;
            right: 30px;
            width: 80px;
            height: 80px;
            background: rgba(255, 50, 50, 0.4);
            border-color: rgba(255, 100, 100, 0.8);
            font-size: 18px;
        }
        #reload-btn {
            bottom: 120px;
            right: 40px;
            width: 55px;
            height: 55px;
            font-size: 12px;
        }

        /* JOYSTICK (LEFT SIDE BOTTOM) */
        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            z-index: 10;
        }
        #joystick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
        }

        /* HEALTH BAR BOTTOM CENTER */
        #health-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 16px;
            background: rgba(0,0,0,0.6);
            border: 2px solid #fff;
            border-radius: 10px;
            overflow: hidden;
            z-index: 10;
        }
        #health-bar {
            width: 100%;
            height: 100%;
            background: #4CAF50;
            transition: width 0.2s;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-container"></div>

    <!-- LEFT SIDE ELEMENTS -->
    <div id="minimap-container">
        <canvas id="minimap"></canvas>
    </div>

    <div id="stats-panel">
        <div class="stat-item">Kills: <span id="kills-val" class="stat-value">0</span></div>
        <div class="stat-item">Zombies Alive: <span id="alive-val" class="stat-value">0</span></div>
        <div class="stat-item">Ammo: <span id="ammo-val" class="stat-value">30 / ∞</span></div>
    </div>

    <!-- AIM RETICLE -->
    <div id="aim-reticle"></div>

    <!-- RIGHT SIDE CONTROLS -->
    <button id="fire-btn" class="control-btn">FIRE</button>
    <button id="reload-btn" class="control-btn">RELOAD</button>

    <!-- JOYSTICK -->
    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <!-- HEALTH BAR -->
    <div id="health-container">
        <div id="health-bar"></div>
    </div>

    <script>
        // --- GAME VARIABLES ---
        let scene, camera, renderer;
        let player, playerBody;
        let zombies = [];
        let bullets = [];
        let mapSize = 100;
        
        let kills = 0;
        let ammo = 30;
        let maxAmmo = 30;
        let isReloading = false;
        let playerHealth = 100;

        // Dynamic 3D Target for Aiming (At Zombie Center Height ~ 1.5 units)
        let aimTarget3D = new THREE.Vector3();
        const aimReticleUI = document.getElementById('aim-reticle');

        // Minimap setup
        const minimapCanvas = document.getElementById('minimap');
        const minimapCtx = minimapCanvas.getContext('2d');
        minimapCanvas.width = 140;
        minimapCanvas.height = 140;

        // Joystick controls
        let moveForward = 0;
        let moveSide = 0;
        let joystickActive = false;
        let joystickTouchId = null;
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        const joystickRadius = 60;

        // Camera Rotation (Touch Dragging Right Side)
        let touchLookId = null;
        let previousTouchX = 0;
        let previousTouchY = 0;
        let cameraYaw = 0;
        let cameraPitch = 0;

        // --- INITIALIZATION ---
        function init() {
            // Scene & Camera
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x11111a);
            scene.fog = new THREE.FogExp2(0x11111a, 0.02);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('game-container').appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Ground
            const groundGeo = new THREE.PlaneGeometry(mapSize, mapSize);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Grid helper for environment details
            const grid = new THREE.GridHelper(mapSize, 20, 0xff0000, 0x444444);
            grid.position.y = 0.01;
            scene.add(grid);

            // Create Player
            createPlayer();

            // Spawn Initial Zombies
            for (let i = 0; i < 6; i++) {
                spawnZombie();
            }

            // Event Listeners
            setupTouchControls();
            window.addEventListener('resize', onWindowResize);

            // Start Loop
            animate();
        }

        // --- PLAYER CREATION ---
        function createPlayer() {
            player = new THREE.Group();

            // Body Mesh
            const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.8, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2196F3 });
            playerBody = new THREE.Mesh(bodyGeo, bodyMat);
            playerBody.position.y = 0.9;
            playerBody.castShadow = true;
            player.add(playerBody);

            // Gun Mesh attached to Player
            const gunGeo = new THREE.BoxGeometry(0.15, 0.15, 0.6);
            const gunMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const gun = new THREE.Mesh(gunGeo, gunMat);
            gun.position.set(0.3, 1.2, 0.4);
            player.add(gun);

            player.position.set(0, 0, 0);
            scene.add(player);
        }

        // --- ZOMBIE SPAWNING ---
        function spawnZombie() {
            const zombie = new THREE.Group();
            
            // Body
            const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.8, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4CAF50 });
            const mesh = new THREE.Mesh(bodyGeo, bodyMat);
            mesh.position.y = 0.9;
            mesh.castShadow = true;
            zombie.add(mesh);

            // Head (for chest/head level target reference)
            const headGeo = new THREE.SphereGeometry(0.3, 8, 8);
            const headMat = new THREE.MeshStandardMaterial({ color: 0x388E3C });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.8;
            zombie.add(head);

            // Spawn at random position outside center
            let x, z;
            do {
                x = (Math.random() - 0.5) * (mapSize - 10);
                z = (Math.random() - 0.5) * (mapSize - 10);
            } while (Math.hypot(x, z) < 10);

            zombie.position.set(x, 0, z);
            scene.add(zombie);

            zombies.push({
                mesh: zombie,
                health: 100,
                speed: 0.03 + Math.random() * 0.02
            });

            updateStatsUI();
        }

        // --- TOUCH & JOYSTICK CONTROLS ---
        function setupTouchControls() {
            // Joystick Touch Events
            joystickZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.changedTouches[0];
                joystickTouchId = touch.identifier;
                joystickActive = true;
                updateJoystick(touch);
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joystickTouchId) {
                        updateJoystick(touch);
                    } else if (touch.identifier === touchLookId) {
                        // Camera rotation
                        const deltaX = touch.clientX - previousTouchX;
                        const deltaY = touch.clientY - previousTouchY;
                        
                        cameraYaw -= deltaX * 0.005;
                        cameraPitch -= deltaY * 0.005;

                        // Pitch limit
                        cameraPitch = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, cameraPitch));

                        previousTouchX = touch.clientX;
                        previousTouchY = touch.clientY;
                    }
                }
            }, { passive: false });

            window.addEventListener('touchend', (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joystickTouchId) {
                        joystickActive = false;
                        joystickTouchId = null;
                        moveForward = 0;
                        moveSide = 0;
                        joystickKnob.style.transform = `translate(0px, 0px)`;
                    } else if (touch.identifier === touchLookId) {
                        touchLookId = null;
                    }
                }
            });

            // Camera Look Touch Area (Right side touch)
            window.addEventListener('touchstart', (e) => {
                for (let touch of e.changedTouches) {
                    // Touch on right half of screen & not on buttons
                    if (touch.clientX > window.innerWidth / 2 && touchLookId === null) {
                        const target = e.target;
                        if (target.id !== 'fire-btn' && target.id !== 'reload-btn') {
                            touchLookId = touch.identifier;
                            previousTouchX = touch.clientX;
                            previousTouchY = touch.clientY;
                        }
                    }
                }
            });

            // Button Click Listeners
            document.getElementById('fire-btn').addEventListener('touchstart', (e) => {
                e.preventDefault();
                shoot();
            });

            document.getElementById('reload-btn').addEventListener('touchstart', (e) => {
                e.preventDefault();
                reload();
            });
        }

        function updateJoystick(touch) {
            const rect = joystickZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const dist = Math.hypot(dx, dy);

            if (dist > joystickRadius) {
                dx = (dx / dist) * joystickRadius;
                dy = (dy / dist) * joystickRadius;
            }

            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;

            moveSide = dx / joystickRadius;
            moveForward = -dy / joystickRadius;
        }

        // --- SHOOTING SYSTEM ---
        function shoot() {
            if (isReloading) return;
            if (ammo <= 0) {
                reload();
                return;
            }

            ammo--;
            updateStatsUI();

            // Bullet Mesh
            const bulletGeo = new THREE.SphereGeometry(0.15, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);

            // Spawn from player chest position
            const spawnPos = player.position.clone();
            spawnPos.y = 1.3;
            bullet.position.copy(spawnPos);

            // Calculate direction towards dynamic 3D aim target (At zombie chest/head level)
            const dir = new THREE.Vector3().subVectors(aimTarget3D, spawnPos).normalize();

            bullets.push({
                mesh: bullet,
                direction: dir,
                life: 100
            });

            scene.add(bullet);
        }

        function reload() {
            if (isReloading || ammo === maxAmmo) return;
            isReloading = true;
            document.getElementById('ammo-val').innerText = "Reloading...";

            setTimeout(() => {
                ammo = maxAmmo;
                isReloading = false;
                updateStatsUI();
            }, 1500);
        }

        // --- GAME LOOP & UPDATES ---
        function animate() {
            requestAnimationFrame(animate);

            updatePlayer();
            updateCameraAndAim();
            updateBullets();
            updateZombies();
            renderMinimap();

            renderer.render(scene, camera);
        }

        function updatePlayer() {
            if (moveForward !== 0 || moveSide !== 0) {
                // Movement direction relative to camera Yaw
                const moveAngle = Math.atan2(moveSide, moveForward) + cameraYaw;
                const speed = 0.12;

                player.position.x -= Math.sin(moveAngle) * speed;
                player.position.z -= Math.cos(moveAngle) * speed;

                // Rotate player towards movement
                player.rotation.y = moveAngle + Math.PI;

                // Boundary Limits
                const limit = mapSize / 2 - 1;
                player.position.x = Math.max(-limit, Math.min(limit, player.position.x));
                player.position.z = Math.max(-limit, Math.min(limit, player.position.z));
            }
        }

        function updateCameraAndAim() {
            // Third Person Camera Positioning Behind Player
            const camDistance = 4.5;
            const camHeight = 2.2;

            const camX = player.position.x + camDistance * Math.sin(cameraYaw) * Math.cos(cameraPitch);
            const camY = player.position.y + camHeight + camDistance * Math.sin(cameraPitch);
            const camZ = player.position.z + camDistance * Math.cos(cameraYaw) * Math.cos(cameraPitch);

            camera.position.set(camX, camY, camZ);

            // --- FIX FOR AIMING HEIGHT ---
            // Aim target positioned in front of player at Zombie Chest Level (y = 1.3)
            const aimDistance = 15;
            aimTarget3D.x = player.position.x - aimDistance * Math.sin(cameraYaw);
            aimTarget3D.y = 1.3; // Straight torso/zombie level (Not ground)
            aimTarget3D.z = player.position.z - aimDistance * Math.cos(cameraYaw);

            camera.lookAt(aimTarget3D);

            // Project 3D aim target to 2D UI reticle
            const projectedAim = aimTarget3D.clone().project(camera);
            const x = (projectedAim.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-(projectedAim.y * 0.5) + 0.5) * window.innerHeight;

            aimReticleUI.style.left = `${x}px`;
            aimReticleUI.style.top = `${y}px`;
        }

        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.mesh.position.addScaledVector(b.direction, 0.8);
                b.life--;

                // Hit Detection against Zombies
                let bulletRemoved = false;
                for (let j = zombies.length - 1; j >= 0; j--) {
                    const z = zombies[j];
                    const dist = b.mesh.position.distanceTo(z.mesh.position.clone().setY(0.9));

                    if (dist < 0.8) {
                        z.health -= 50;
                        scene.remove(b.mesh);
                        bullets.splice(i, 1);
                        bulletRemoved = true;

                        if (z.health <= 0) {
                            scene.remove(z.mesh);
                            zombies.splice(j, 1);
                            kills++;
                            updateStatsUI();
                            // Respawn new zombie
                            setTimeout(spawnZombie, 1000);
                        }
                        break;
                    }
                }

                if (!bulletRemoved && b.life <= 0) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }
        }

        function updateZombies() {
            zombies.forEach((z) => {
                // Move towards player
                const dir = new THREE.Vector3().subVectors(player.position, z.mesh.position);
                dir.y = 0;
                dir.normalize();

                z.mesh.position.addScaledVector(dir, z.speed);
                z.mesh.lookAt(player.position.x, z.mesh.position.y, player.position.z);

                // Player damage collision
                const dist = player.position.distanceTo(z.mesh.position);
                if (dist < 1.0) {
                    playerHealth -= 0.2;
                    document.getElementById('health-bar').style.width = `${Math.max(0, playerHealth)}%`;
                    if (playerHealth <= 0) {
                        alert("Game Over! Kills: " + kills);
                        location.reload();
                    }
                }
            });
        }

        // --- MINIMAP RENDERING ---
        function renderMinimap() {
            minimapCtx.clearRect(0, 0, 140, 140);

            const mapScale = 140 / mapSize;
            const center = 70;

            // Player position on minimap
            const px = center + player.position.x * mapScale;
            const pz = center + player.position.z * mapScale;

            // Draw Player (Blue)
            minimapCtx.fillStyle = '#2196F3';
            minimapCtx.beginPath();
            minimapCtx.arc(px, pz, 4, 0, Math.PI * 2);
            minimapCtx.fill();

            // Draw Zombies (Red)
            minimapCtx.fillStyle = '#ff3333';
            zombies.forEach(z => {
                const zx = center + z.mesh.position.x * mapScale;
                const zz = center + z.mesh.position.z * mapScale;
                minimapCtx.beginPath();
                minimapCtx.arc(zx, zz, 3, 0, Math.PI * 2);
                minimapCtx.fill();
            });
        }

        function updateStatsUI() {
            document.getElementById('kills-val').innerText = kills;
            document.getElementById('alive-val').innerText = zombies.length;
            if (!isReloading) {
                document.getElementById('ammo-val').innerText = `${ammo} / ∞`;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
