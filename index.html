<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stardust Warrior: Ultimate Survival RPG</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: 'Segoe UI', Roboto, sans-serif; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top:0; left:0; }
    
    /* Crosshair */
    #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 14px; height: 14px; pointer-events: none; z-index: 20; }
    #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.9); box-shadow: 0 0 4px #000; }
    #crosshair::before { top: 6px; left: 0; width: 14px; height: 2px; }
    #crosshair::after { top: 0; left: 6px; width: 2px; height: 14px; }

    /* SURVIVAL VITALS HUD (Bottom-Left) */
    #vitals-panel { position: absolute; bottom: 20px; left: 20px; width: 220px; display: flex; flex-direction: column; gap: 5px; z-index: 30; pointer-events: none; }
    .vital-box { width: 100%; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255,255,255,0.25); border-radius: 6px; padding: 4px 8px; color: #f8fafc; font-size: 10px; font-weight: bold; backdrop-filter: blur(4px); }
    .vital-bar { height: 6px; width: 100%; background: #334155; border-radius: 3px; overflow: hidden; margin-top: 2px; }
    .vital-fill { height: 100%; width: 100%; transition: width 0.2s linear; }
    #fill-hp { background: #ef4444; }
    #fill-hunger { background: #f59e0b; }
    #fill-thirst { background: #06b6d4; }
    #fill-temp { background: #a855f7; }

    /* TOP RIGHT CONTROLS & RADAR MAP */
    #top-right-hud { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; align-items: flex-start; z-index: 30; }
    .hud-btn { background: rgba(15, 23, 42, 0.85); color: #38bdf8; border: 1px solid #38bdf8; border-radius: 8px; padding: 8px 12px; font-size: 11px; font-weight: bold; cursor: pointer; backdrop-filter: blur(4px); }
    #minimap-card { width: 100px; height: 100px; border-radius: 50%; border: 2px solid #38bdf8; background: rgba(15, 23, 42, 0.9); overflow: hidden; cursor: pointer; }
    #minimap-canvas { width: 100%; height: 100%; }

    /* PROMPTS & MESSAGES */
    #interaction-prompt { display: none; position: absolute; top: 62%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 23, 42, 0.9); color: #38bdf8; border: 2px solid #38bdf8; padding: 10px 20px; border-radius: 10px; font-size: 12px; font-weight: bold; z-index: 35; text-align: center; }

    /* JOYSTICK CONTROLS */
    #joystick-container { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%; touch-action: none; z-index: 40; }
    #joystick-knob { position: absolute; top: 50%; left: 50%; width: 44px; height: 44px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); }

    /* ACTION BUTTONS */
    .action-btn { position: absolute; background: rgba(15, 23, 42, 0.7); color: #fff; border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 11px; backdrop-filter: blur(4px); z-index: 40; touch-action: manipulation; }
    .action-btn:active { transform: scale(0.92); background: rgba(34, 197, 94, 0.85); }
    #btn-fire { bottom: 85px; right: 110px; width: 68px; height: 68px; background: rgba(220, 38, 38, 0.85); border-color: #fca5a5; font-size: 13px; }
    #btn-vehicle { display: none; bottom: 100px; right: 200px; width: 60px; height: 60px; border-radius: 12px; background: #2563eb; border: 2px solid #93c5fd; text-align: center; font-size: 10px; line-height: 1.2; }

    /* MODALS (INVENTORY & CRAFTING) */
    .game-modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 23, 42, 0.95); border: 2px solid #38bdf8; border-radius: 12px; padding: 16px; color: #fff; z-index: 100; backdrop-filter: blur(10px); width: 340px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.15); padding-bottom: 8px; margin-bottom: 12px; font-weight: bold; color: #38bdf8; font-size: 14px; }
    .inventory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .inv-slot { aspect-ratio: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: #94a3b8; }
    .craft-item-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 8px; border-radius: 6px; margin-bottom: 6px; font-size: 12px; }
    .btn-craft { background: #22c55e; border: none; color: #fff; padding: 4px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  <div id="crosshair"></div>

  <!-- SURVIVAL VITALS PANEL -->
  <div id="vitals-panel">
    <div class="vital-box">HEALTH <div class="vital-bar"><div id="fill-hp" class="vital-fill"></div></div></div>
    <div class="vital-box">HUNGER <div class="vital-bar"><div id="fill-hunger" class="vital-fill"></div></div></div>
    <div class="vital-box">THIRST <div class="vital-bar"><div id="fill-thirst" class="vital-fill"></div></div></div>
    <div class="vital-box">BODY TEMP <div class="vital-bar"><div id="fill-temp" class="vital-fill"></div></div></div>
  </div>

  <!-- TOP RIGHT CONTROLS -->
  <div id="top-right-hud">
    <button id="btn-crafting-open" class="hud-btn">CRAFTING</button>
    <button id="btn-inventory-open" class="hud-btn">BACKPACK</button>
    <div id="minimap-card"><canvas id="minimap-canvas" width="100" height="100"></canvas></div>
  </div>

  <div id="interaction-prompt">PROMPT MESSAGE</div>

  <!-- TOUCH CONTROLS LAYER -->
  <div id="joystick-container"><div id="joystick-knob"></div></div>
  <div id="btn-fire" class="action-btn">FIRE</div>
  <div id="btn-vehicle" class="action-btn">ENTER<br>VEHICLE</div>

  <!-- INVENTORY BACKPACK MODAL -->
  <div id="modal-inventory" class="game-modal">
    <div class="modal-header">
      <span>BACKPACK (WEIGHT: <span id="inv-weight">3.2</span>/30 kg)</span>
      <button class="btn-close-modal" style="background:none; border:none; color:#fff; font-size:16px; cursor:pointer;">X</button>
    </div>
    <div class="inventory-grid">
      <div class="inv-slot" style="color:#38bdf8;">Wood<br>x15</div>
      <div class="inv-slot" style="color:#38bdf8;">Stone<br>x10</div>
      <div class="inv-slot" style="color:#22c55e;">Bandage<br>x3</div>
      <div class="inv-slot" style="color:#f59e0b;">Canned Food<br>x2</div>
      <div class="inv-slot" style="color:#06b6d4;">Water Bottle<br>x2</div>
      <div class="inv-slot" style="color:#a855f7;">Ammo<br>x60</div>
      <div class="inv-slot">Empty</div>
      <div class="inv-slot">Empty</div>
    </div>
  </div>

  <!-- CRAFTING MODAL -->
  <div id="modal-crafting" class="game-modal">
    <div class="modal-header">
      <span>SURVIVAL CRAFTING</span>
      <button class="btn-close-modal" style="background:none; border:none; color:#fff; font-size:16px; cursor:pointer;">X</button>
    </div>
    <div class="craft-item-row">
      <span>Wooden Axe (10 Wood)</span>
      <button class="btn-craft" onclick="craftItem('Axe')">CRAFT</button>
    </div>
    <div class="craft-item-row">
      <span>Campfire (5 Wood, 5 Stone)</span>
      <button class="btn-craft" onclick="craftItem('Campfire')">CRAFT</button>
    </div>
    <div class="craft-item-row">
      <span>Medkit (2 Bandages)</span>
      <button class="btn-craft" onclick="craftItem('Medkit')">CRAFT</button>
    </div>
  </div>

  <script>
    // --- THREE.JS ENGINE SETUP ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    // Day & Night Dynamic Sky Color Variables
    const skyColorDay = new THREE.Color(0x38bdf8);
    const skyColorNight = new THREE.Color(0x020617);
    scene.background = skyColorDay.clone();
    scene.fog = new THREE.FogExp2(0x38bdf8, 0.0035);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // --- LIGHTS & DAY-NIGHT CYCLE ENGINE ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const sunLight = new THREE.DirectionalLight(0xfffbe1, 1.2);
    sunLight.position.set(100, 150, 50);
    sunLight.castShadow = true;
    scene.add(sunLight);

    let dayTime = 0; // 0 to 1 cycle
    let isNight = false;

    // --- PROCEDURAL MULTI-BIOME TERRAIN ENGINE ---
    const worldSize = 700;
    const terrainGeo = new THREE.PlaneGeometry(worldSize, worldSize, 120, 120);
    terrainGeo.rotateX(-Math.PI / 2);

    const pos = terrainGeo.attributes.position;
    const colors = [];

    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const z = pos.getZ(i);

      // Multi-Biome Heights (Valleys, Desert Dunes, High Mountains)
      let h = Math.sin(x * 0.015) * Math.cos(z * 0.015) * 18 + Math.sin(x * 0.04) * 5;
      pos.setY(i, h);

      // Biome Color Palette Mapping
      const color = new THREE.Color();
      if (h > 15) {
        color.setHex(0xf8fafc); // Snow Peak
      } else if (x > 100) {
        color.setHex(0xeab308); // Desert Biome
      } else if (z < -100) {
        color.setHex(0x14532d); // Deep Forest Biome
      } else {
        color.setHex(0x3f6212); // Valley Grass Biome
      }
      colors.push(color.r, color.g, color.b);
    }
    terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    terrainGeo.computeVertexNormals();

    const terrainMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9 });
    const terrain = new THREE.Mesh(terrainGeo, terrainMat);
    terrain.receiveShadow = true;
    scene.add(terrain);

    function getTerrainHeight(x, z) {
      return Math.sin(x * 0.015) * Math.cos(z * 0.015) * 18 + Math.sin(x * 0.04) * 5;
    }

    // --- PLAYER & CHARACTER MODEL ---
    const playerGroup = new THREE.Group();
    scene.add(playerGroup);

    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.5), new THREE.MeshStandardMaterial({ color: 0x0284c7 }));
    torso.position.y = 1.2;
    playerGroup.add(torso);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 12), new THREE.MeshStandardMaterial({ color: 0xffdbac }));
    head.position.y = 2.1;
    playerGroup.add(head);

    const gunMesh = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.15, 0.8), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
    gunMesh.position.set(0.35, 1.2, -0.4);
    playerGroup.add(gunMesh);

    const vitals = { hp: 100, hunger: 100, thirst: 100, temp: 100 };
    const playerSpeed = 0.32;

    // --- DRIVABLE VEHICLE SYSTEM (SUV) ---
    const vehicleGroup = new THREE.Group();
    const vBody = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.3, 4.5), new THREE.MeshStandardMaterial({ color: 0xd97706 }));
    vBody.position.y = 0.9;
    vehicleGroup.add(vBody);
    const vCabin = new THREE.Mesh(new THREE.BoxGeometry(2.0, 1.0, 2.4), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
    vCabin.position.set(0, 1.8, -0.2);
    vehicleGroup.add(vCabin);

    vehicleGroup.position.set(15, getTerrainHeight(15, 15), 15);
    scene.add(vehicleGroup);

    let inVehicle = false;

    // --- BUILDINGS & LOOT CONTAINERS ---
    const loots = [];
    function createBuilding(x, z, type) {
      const bGroup = new THREE.Group();
      const y = getTerrainHeight(x, z);

      const house = new THREE.Mesh(
        new THREE.BoxGeometry(10, 5, 10),
        new THREE.MeshStandardMaterial({ color: type === 'Military' ? 0x334155 : 0x94a3b8 })
      );
      house.position.y = 2.5;
      bGroup.add(house);

      bGroup.position.set(x, y, z);
      scene.add(bGroup);

      // Spawn Loot inside
      const lootMesh = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 0.6), new THREE.MeshStandardMaterial({ color: 0xf59e0b }));
      lootMesh.position.set(x, y + 0.5, z);
      scene.add(lootMesh);
      loots.push(lootMesh);
    }

    createBuilding(30, -30, 'House');
    createBuilding(-60, 40, 'Military');

    // --- ZOMBIE AI & BOSS ZOMBIE SYSTEM ---
    const zombies = [];

    function spawnZombie(isBoss = false) {
      const zGroup = new THREE.Group();
      const scale = isBoss ? 2.2 : 1.0;
      const zMat = new THREE.MeshStandardMaterial({ color: isBoss ? 0xdc2626 : 0x16a34a });

      const zTorso = new THREE.Mesh(new THREE.BoxGeometry(0.8 * scale, 1.2 * scale, 0.5 * scale), zMat);
      zTorso.position.y = 1.2 * scale;
      zGroup.add(zTorso);

      const angle = Math.random() * Math.PI * 2;
      const dist = 50 + Math.random() * 50;
      const x = playerGroup.position.x + Math.cos(angle) * dist;
      const z = playerGroup.position.z + Math.sin(angle) * dist;

      zGroup.position.set(x, getTerrainHeight(x, z), z);
      zGroup.userData = { isBoss, hp: isBoss ? 400 : 100, speed: isBoss ? 0.12 : 0.08 };

      scene.add(zGroup);
      zombies.push(zGroup);
    }

    for (let i = 0; i < 12; i++) spawnZombie(false);
    spawnZombie(true); // Spawn Giant Boss Zombie

    // --- CONTROLS & TOUCH ENGINE ---
    let cameraYaw = 0, cameraPitch = 0.2;
    let joystickInput = { x: 0, y: 0 };

    const jContainer = document.getElementById('joystick-container');
    const jKnob = document.getElementById('joystick-knob');
    let jActive = false, jOrigin = { x: 0, y: 0 };

    jContainer.addEventListener('touchstart', (e) => {
      jActive = true;
      const rect = jContainer.getBoundingClientRect();
      jOrigin = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    });

    window.addEventListener('touchmove', (e) => {
      if (!jActive) return;
      const touch = e.touches[0];
      const dx = touch.clientX - jOrigin.x;
      const dy = touch.clientY - jOrigin.y;
      const dist = Math.min(Math.hypot(dx, dy), 40);
      const angle = Math.atan2(dy, dx);

      jKnob.style.transform = `translate(calc(-50% + ${Math.cos(angle) * dist}px), calc(-50% + ${Math.sin(angle) * dist}px))`;
      joystickInput.x = (Math.cos(angle) * dist) / 40;
      joystickInput.y = -(Math.sin(angle) * dist) / 40; // Forward Axis Fixed
    });

    window.addEventListener('touchend', () => {
      jActive = false;
      jKnob.style.transform = 'translate(-50%, -50%)';
      joystickInput = { x: 0, y: 0 };
    });

    // Touch Camera rotation
    let lastT = { x: 0, y: 0 };
    window.addEventListener('touchstart', (e) => {
      if (e.touches[0].clientX > window.innerWidth / 2) {
        lastT.x = e.touches[0].clientX;
        lastT.y = e.touches[0].clientY;
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches[0].clientX > window.innerWidth / 2) {
        const dx = e.touches[0].clientX - lastT.x;
        const dy = e.touches[0].clientY - lastT.y;
        cameraYaw -= dx * 0.005;
        cameraPitch -= dy * 0.003; // Inversion Fixed
        cameraPitch = Math.max(-0.2, Math.min(Math.PI / 3, cameraPitch));
        lastT.x = e.touches[0].clientX;
        lastT.y = e.touches[0].clientY;
      }
    });

    // Modal Control Triggers
    const modalInv = document.getElementById('modal-inventory');
    const modalCraft = document.getElementById('modal-crafting');

    document.getElementById('btn-inventory-open').onclick = () => modalInv.style.display = 'block';
    document.getElementById('btn-crafting-open').onclick = () => modalCraft.style.display = 'block';
    document.querySelectorAll('.btn-close-modal').forEach(b => b.onclick = () => {
      modalInv.style.display = 'none';
      modalCraft.style.display = 'none';
    });

    function craftItem(name) {
      alert(`Crafted ${name} successfully!`);
      modalCraft.style.display = 'none';
    }

    // Vehicle Interaction Trigger
    const btnVehicle = document.getElementById('btn-vehicle');
    btnVehicle.onclick = () => {
      inVehicle = !inVehicle;
      playerGroup.visible = !inVehicle;
      if (!inVehicle) {
        playerGroup.position.set(vehicleGroup.position.x + 2, getTerrainHeight(vehicleGroup.position.x + 2, vehicleGroup.position.z), vehicleGroup.position.z);
      }
      btnVehicle.innerHTML = inVehicle ? "EXIT<br>VEHICLE" : "ENTER<br>VEHICLE";
    };

    // --- MINIMAP RADAR ---
    const miniCtx = document.getElementById('minimap-canvas').getContext('2d');
    function updateMinimap() {
      miniCtx.clearRect(0, 0, 100, 100);
      miniCtx.fillStyle = '#38bdf8';
      miniCtx.beginPath();
      miniCtx.arc(50, 50, 4, 0, Math.PI * 2);
      miniCtx.fill();

      // Render Zombies on Radar Map
      zombies.forEach(z => {
        const dx = (z.position.x - playerGroup.position.x) * 0.7;
        const dz = (z.position.z - playerGroup.position.z) * 0.7;
        if (Math.hypot(dx, dz) < 45) {
          miniCtx.fillStyle = z.userData.isBoss ? '#dc2626' : '#22c55e';
          miniCtx.beginPath();
          miniCtx.arc(50 + dx, 50 + dz, z.userData.isBoss ? 4 : 2, 0, Math.PI * 2);
          miniCtx.fill();
        }
      });
    }

    // --- MAIN GAME RENDER LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      // --- DYNAMIC DAY & NIGHT ENGINE ---
      dayTime += 0.0003;
      sunLight.position.x = Math.cos(dayTime) * 200;
      sunLight.position.y = Math.sin(dayTime) * 200;
      isNight = sunLight.position.y < 0;

      scene.background.lerp(isNight ? skyColorNight : skyColorDay, 0.02);
      ambientLight.intensity = isNight ? 0.2 : 0.65;

      // --- MOVEMENT ENGINE ---
      const activeObj = inVehicle ? vehicleGroup : playerGroup;
      if (Math.abs(joystickInput.x) > 0.1 || Math.abs(joystickInput.y) > 0.1) {
        const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraYaw);
        const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraYaw);

        const moveDir = new THREE.Vector3()
          .addScaledVector(right, joystickInput.x)
          .addScaledVector(forward, joystickInput.y)
          .normalize();

        const speed = inVehicle ? 0.8 : playerSpeed;
        activeObj.position.x += moveDir.x * speed;
        activeObj.position.z += moveDir.z * speed;
        activeObj.rotation.y = Math.atan2(moveDir.x, moveDir.z);
      }

      // Snap Objects to Terrain Height Surface
      activeObj.position.y = getTerrainHeight(activeObj.position.x, activeObj.position.z);
      if (inVehicle) playerGroup.position.copy(vehicleGroup.position);

      // --- CAMERA THIRD PERSON ENGINE ---
      const camDist = inVehicle ? 9 : 6;
      camera.position.x = activeObj.position.x - Math.sin(cameraYaw) * camDist;
      camera.position.z = activeObj.position.z - Math.cos(cameraYaw) * camDist;
      camera.position.y = activeObj.position.y + 3 + Math.sin(cameraPitch) * 3;
      camera.lookAt(activeObj.position.x, activeObj.position.y + 1.5, activeObj.position.z);

      // --- SURVIVAL VITALS DRAIN ENGINE ---
      vitals.hunger = Math.max(0, vitals.hunger - 0.004);
      vitals.thirst = Math.max(0, vitals.thirst - 0.007);
      if (isNight) vitals.temp = Math.max(20, vitals.temp - 0.01);
      else vitals.temp = Math.min(100, vitals.temp + 0.01);

      document.getElementById('fill-hp').style.width = vitals.hp + '%';
      document.getElementById('fill-hunger').style.width = vitals.hunger + '%';
      document.getElementById('fill-thirst').style.width = vitals.thirst + '%';
      document.getElementById('fill-temp').style.width = vitals.temp + '%';

      // --- SMART ZOMBIE AI CHASE & DAMAGE ENGINE ---
      const nightSpeedMultiplier = isNight ? 1.8 : 1.0;
      zombies.forEach((z, idx) => {
        const dir = new THREE.Vector3().subVectors(activeObj.position, z.position).normalize();
        const moveSpeed = z.userData.speed * nightSpeedMultiplier;
        z.position.add(dir.multiplyScalar(moveSpeed));
        z.position.y = getTerrainHeight(z.position.x, z.position.z);
        z.lookAt(activeObj.position.x, z.position.y, activeObj.position.z);

        // Vehicle Crush Zombies Mechanics
        if (inVehicle && vehicleGroup.position.distanceTo(z.position) < 2.5) {
          scene.remove(z);
          zombies.splice(idx, 1);
          spawnZombie(false);
        }

        // Damage Player
        if (!inVehicle && z.position.distanceTo(playerGroup.position) < 1.5) {
          vitals.hp = Math.max(0, vitals.hp - (z.userData.isBoss ? 0.8 : 0.3));
        }
      });

      // Vehicle Proximity Prompt
      const distToCar = playerGroup.position.distanceTo(vehicleGroup.position);
      btnVehicle.style.display = (distToCar < 4.5 || inVehicle) ? 'flex' : 'none';

      updateMinimap();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
